name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Typecheck, and Tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg15
        env:
          POSTGRES_USER: surakshanet
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: surakshanet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8 ruff mypy httpx aiosqlite

      - name: Lint with ruff and flake8
        run: |
          cd backend
          ruff check app/
          flake8 app/ --max-line-length=120 --ignore=E501,W503

      - name: Typecheck with mypy
        run: |
          cd backend
          mypy app/ --ignore-missing-imports

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://surakshanet:test_password@localhost:5432/surakshanet_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://surakshanet:test_password@localhost:5432/surakshanet_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long
          ENVIRONMENT: testing
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend/dashboard
          npm install

      - name: Typecheck with tsc
        run: |
          cd frontend/dashboard
          npx tsc --noEmit

      - name: Run Frontend Tests
        run: |
          cd frontend/dashboard
          npm test

      - name: Build Dashboard
        run: |
          cd frontend/dashboard
          npm run build
