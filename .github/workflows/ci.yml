name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase0-guard:
    name: Phase 0 Regression Guard (SN-140)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert Phase 0 deletions still hold
        run: ./scripts/check_phase0_regressions.sh

  backend:
    name: Backend Lint, Typecheck, and Tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg15
        env:
          POSTGRES_USER: surakshanet
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: surakshanet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          # Lint/type tools are pinned. Previously unpinned, which meant a new
          # ruff release could change the default rule set and fail CI without
          # any code change.
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite \
                      ruff==0.16.6 flake8==7.1.1 mypy==1.13.0

      # Both linters read their config from the repo (backend/ruff.toml and
      # backend/.flake8) rather than inline flags, so local runs and CI agree.
      - name: Lint with ruff and flake8
        run: |
          cd backend
          ruff check app/
          flake8 app/

      # Advisory, not blocking. 34 of the current 56 findings are the
      # SQLAlchemy Column[...] descriptor pattern -- mypy sees the class-level
      # Column[str] rather than the str returned at runtime. Clearing them means
      # migrating the models to SQLAlchemy 2.0 Mapped[] annotations, which is a
      # refactor rather than a config fix. Reported so the count is visible;
      # flip continue-on-error off once that migration lands.
      - name: Typecheck with mypy (advisory)
        continue-on-error: true
        run: |
          cd backend
          mypy app/ --ignore-missing-imports

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://surakshanet:test_password@localhost:5432/surakshanet_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://surakshanet:test_password@localhost:5432/surakshanet_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long
          ENVIRONMENT: testing
          # app/api/routing.py and app/api/emergency.py import ml.* at module
          # level, and ml/, shared/ and simulation/ live at the repo root rather
          # than under backend/. The Docker image flattens everything into /app
          # so it resolves there; pytest running from backend/ needs the root on
          # the path explicitly.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend/dashboard
          npm install

      - name: Typecheck with tsc
        run: |
          cd frontend/dashboard
          npx tsc --noEmit

      - name: Run Frontend Tests
        run: |
          cd frontend/dashboard
          npm test

      - name: Build Dashboard
        run: |
          cd frontend/dashboard
          npm run build
