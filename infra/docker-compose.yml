version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: surakshanet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surakshanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surakshanet_dev}
      POSTGRES_DB: ${POSTGRES_DB:-surakshanet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - surakshanet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surakshanet} -d ${POSTGRES_DB:-surakshanet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb-ha:pg15
    container_name: surakshanet-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surakshanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surakshanet_dev}
      POSTGRES_DB: ${POSTGRES_DB:-surakshanet}
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    networks:
      - surakshanet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surakshanet} -d ${POSTGRES_DB:-surakshanet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surakshanet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - surakshanet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: surakshanet-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - surakshanet-network

networks:
  surakshanet-network:
    driver: bridge

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
