services:
  timescaledb:
    image: timescale/timescaledb-ha:pg15
    container_name: surakshanet-timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surakshanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-surakshanet}
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    networks:
      surakshanet-network:
        aliases:
          - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surakshanet} -d ${POSTGRES_DB:-surakshanet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surakshanet-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - surakshanet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: surakshanet-mosquitto
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/password_file:/mosquitto/config/password_file:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - surakshanet-network
    restart: unless-stopped

  backend:
    image: ${DOCKER_USERNAME:-surakshanet}/surakshanet-backend:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: surakshanet-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in production}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set in production}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL must be set in production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in production}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost}
    networks:
      - surakshanet-network
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  frontend:
    image: ${DOCKER_USERNAME:-surakshanet}/surakshanet-dashboard:latest
    build:
      context: ../frontend/dashboard
      dockerfile: Dockerfile
    container_name: surakshanet-frontend
    networks:
      - surakshanet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.25-alpine
    container_name: surakshanet-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - surakshanet-network
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: surakshanet-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - surakshanet-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    container_name: surakshanet-grafana
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - surakshanet-network
    restart: unless-stopped

networks:
  surakshanet-network:
    driver: bridge

volumes:
  timescale_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  prometheus_data:
  grafana_data:
